<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gov.br Mobile - Visualizador de Documentos (Carrossel Interativo)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        govNavy: '#1351b4',
                        govBlueHeader: '#0c326f',
                        govGreen: '#138e3d',
                        govYellow: '#ffcd07'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-screen {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 880px;
            background-color: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 640px) {
            .mobile-screen {
                border-radius: 40px;
                border: 8px solid #334155;
                height: 844px;
            }
        }

        /* Carousel Track */
        .carousel-track {
            display: flex;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            touch-action: pan-y;
            will-change: transform;
        }

        .carousel-slide {
            min-width: 100%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 16px;
            box-sizing: border-box;
        }

        /* Zoom Effect */
        .zoom-container {
            transition: transform 0.25s ease-out;
            transform-origin: center center;
        }

        /* Custom Scrollbar for inner elements */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Watermark & Security Pattern styling for Fallback Cards */
        .guilloche-bg {
            background-color: #e8f4f8;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(19, 142, 61, 0.08) 0%, transparent 60%),
                repeating-linear-gradient(45deg, rgba(12, 50, 111, 0.03) 0px, rgba(12, 50, 111, 0.03) 2px, transparent 2px, transparent 8px),
                repeating-linear-gradient(-45deg, rgba(19, 142, 61, 0.03) 0px, rgba(19, 142, 61, 0.03) 2px, transparent 2px, transparent 8px);
        }
    </style>
</head>
<body>

    <!-- Main Mobile Shell Container -->
    <div class="mobile-screen">

        <!-- MOBILE TOP STATUS BAR -->
        <div class="w-full bg-white px-6 pt-3 pb-2 flex justify-between items-center text-xs text-slate-800 font-semibold z-30 select-none">
            <span>20:45</span>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters text-sm"></i>
            </div>
        </div>

        <!-- APP VIEWS CONTAINER -->
        <div class="flex-1 relative overflow-hidden flex flex-col bg-slate-100">

            <!-- ================= VIEW 1: CARTEIRA (LISTA DE DOCUMENTOS) ================= -->
            <div id="view-carteira" class="absolute inset-0 flex flex-col transition-all duration-300 z-10 bg-slate-50">
                <!-- Header Gov.br Top -->
                <div class="bg-white px-4 py-3 flex justify-between items-center border-b border-slate-100">
                    <div class="flex items-center gap-1">
                        <span class="text-govNavy font-extrabold text-2xl tracking-tighter">gov<span class="text-govGreen">.br</span></span>
                    </div>
                    <div class="w-9 h-9 rounded-full bg-slate-200 border-2 border-slate-300 overflow-hidden flex items-center justify-center text-slate-500">
                        <i class="fa-solid fa-user text-lg"></i>
                    </div>
                </div>

                <!-- Section Blue Header -->
                <div class="bg-govBlueHeader text-white px-4 py-3.5 flex items-center justify-between shadow-md">
                    <div class="flex items-center gap-4">
                        <button class="text-white hover:opacity-80 transition-opacity">
                            <i class="fa-solid fa-chevron-left text-lg"></i>
                        </button>
                        <h1 class="text-lg font-medium tracking-wide">Carteira de documentos</h1>
                    </div>
                </div>

                <!-- Main Scrollable Content -->
                <div class="flex-1 overflow-y-auto p-4 flex flex-col justify-between">
                    <div class="space-y-4">
                        <!-- ID Card Entry Item -->
                        <div onclick="openDocumentView()" class="relative rounded-2xl bg-gradient-to-r from-cyan-200 via-sky-200 to-teal-200 p-5 shadow-sm border border-cyan-300/60 cursor-pointer transition-transform active:scale-98 hover:shadow-md overflow-hidden">
                            <!-- Tag -->
                            <div class="absolute top-0 left-0 bg-govYellow text-slate-900 text-[10px] font-bold px-3 py-0.5 rounded-br-md tracking-wider">
                                ID
                            </div>

                            <!-- Decorative Coat of Arms -->
                            <div class="absolute -right-6 -bottom-6 w-36 h-36 opacity-20 pointer-events-none">
                                <svg viewBox="0 0 100 100" fill="currentColor" class="text-teal-900">
                                    <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="4" fill="none"/>
                                    <polygon points="50,15 62,38 87,42 68,60 73,85 50,72 27,85 32,60 13,42 38,38" fill="currentColor"/>
                                </svg>
                            </div>

                            <div class="mt-2 space-y-1">
                                <h2 class="text-lg font-bold text-slate-900 leading-tight">Carteira de Identidade</h2>
                                <p class="text-sm font-semibold text-slate-700 tracking-wide">NOME DO CIDADÃO EXEMPLO</p>
                            </div>

                            <div class="mt-4">
                                <span class="text-xs text-slate-600 block uppercase font-medium">CPF</span>
                                <span class="text-sm font-mono font-bold text-slate-900 tracking-wider">000.000.000-00</span>
                            </div>
                        </div>

                        <!-- Upload custom PDF option for testing -->
                        <div class="bg-white p-4 rounded-2xl border border-dashed border-slate-300 text-center shadow-xs">
                            <i class="fa-solid fa-file-pdf text-3xl text-rose-500 mb-2 block"></i>
                            <p class="text-xs text-slate-600 font-medium mb-3">Carregue um PDF para visualizar no carrossel de páginas:</p>
                            <label class="inline-block bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-xl cursor-pointer transition-colors shadow-sm">
                                <i class="fa-solid fa-upload mr-1.5"></i> Escolher arquivo PDF
                                <input type="file" id="pdf-file-input" accept="application/pdf" class="hidden" onchange="handleFileUpload(event)">
                            </label>
                            <p id="upload-status" class="text-[11px] text-govGreen font-medium mt-2 hidden"><i class="fa-solid fa-circle-check mr-1"></i> PDF personalizado carregado com sucesso!</p>
                        </div>
                    </div>

                    <!-- Bottom Action Button -->
                    <div class="mt-auto pt-4 pb-2">
                        <button onclick="openDocumentView()" class="w-full bg-govNavy hover:bg-blue-800 text-white font-medium py-3.5 px-4 rounded-full shadow-md transition-colors flex items-center justify-center gap-2">
                            <span>Visualizar documento</span>
                        </button>
                    </div>
                </div>
            </div>


            <!-- ================= VIEW 2: CARROSSEL DE NAVEGAÇÃO DO DOCUMENTO ================= -->
            <div id="view-documento" class="absolute inset-0 flex flex-col transition-all duration-300 translate-x-full z-20 bg-white">
                
                <!-- Header Gov.br Top with Close (X) -->
                <div class="bg-white px-4 py-3 flex justify-between items-center border-b border-slate-100 z-10">
                    <div class="flex items-center gap-1">
                        <span class="text-govNavy font-extrabold text-2xl tracking-tighter">gov<span class="text-govGreen">.br</span></span>
                    </div>
                    <button onclick="closeDocumentView()" class="text-govNavy p-1 hover:bg-slate-100 rounded-full transition-colors">
                        <i class="fa-solid fa-xmark text-2xl"></i>
                    </button>
                </div>

                <!-- Document Viewing Stage (Flexible Height) -->
                <div class="flex-1 relative flex flex-col items-center justify-between py-2 overflow-hidden bg-slate-50">
                    
                    <!-- Yellow Title Badge -->
                    <div class="bg-govYellow text-slate-900 text-xs font-bold py-1 px-5 rounded-md my-2 text-center tracking-wide uppercase shadow-sm z-10">
                        Documento de Identificação
                    </div>

                    <!-- CAROUSEL TRACK VIEWPORT CONTAINER -->
                    <div id="carousel-viewport" class="w-full flex-1 flex items-center overflow-hidden relative cursor-grab active:cursor-grabbing">
                        <div id="zoom-wrapper" class="w-full zoom-container">
                            <div id="carousel-track" class="carousel-track">
                                <!-- Slides will be rendered here dynamically via JS -->
                            </div>
                        </div>
                    </div>

                    <!-- CONTROLS FOOTER: ZOOM, 4 CAROUSEL DOTS, GREEN MENU BUTTON -->
                    <div class="w-full flex justify-between items-center px-5 py-3 bg-white border-t border-slate-100 z-10">
                        
                        <!-- Magnifier Zoom Button -->
                        <button onclick="toggleZoom()" id="btn-zoom" class="w-11 h-11 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 flex items-center justify-center shadow-xs transition-all">
                            <i id="zoom-icon" class="fa-solid fa-magnifying-glass-plus text-base"></i>
                        </button>

                        <!-- EXACT 4 CAROUSEL DOTS INDICATOR + RIGHT ARROW -->
                        <div class="flex items-center gap-2 bg-slate-100/80 px-3 py-2 rounded-full border border-slate-200/60">
                            <button onclick="goToSlide(0)" class="dot-item w-2.5 h-2.5 rounded-full bg-govNavy transition-all duration-300 focus:outline-none" aria-label="Página 1"></button>
                            <button onclick="goToSlide(1)" class="dot-item w-2.5 h-2.5 rounded-full bg-slate-300 transition-all duration-300 focus:outline-none" aria-label="Página 2"></button>
                            <button onclick="goToSlide(2)" class="dot-item w-2.5 h-2.5 rounded-full bg-slate-300 transition-all duration-300 focus:outline-none" aria-label="Página 3"></button>
                            <button onclick="goToSlide(3)" class="dot-item w-2.5 h-2.5 rounded-full bg-slate-300 transition-all duration-300 focus:outline-none" aria-label="Página 4"></button>
                            
                            <!-- Next Arrow -->
                            <button onclick="nextSlide()" class="text-govNavy hover:text-blue-800 transition-colors ml-1 focus:outline-none">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        </div>

                        <!-- Green Action Floating Button -->
                        <button onclick="toggleOptionsMenu()" class="w-11 h-11 rounded-2xl bg-govGreen hover:bg-emerald-700 active:scale-95 text-white flex items-center justify-center shadow-md transition-all">
                            <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
                        </button>
                    </div>

                </div>
            </div>

        </div>

        <!-- OPTIONS POPUP MENU (Triggered by Green Button) -->
        <div id="options-menu" class="absolute bottom-20 right-6 bg-white border border-slate-200 rounded-2xl shadow-xl p-2 hidden z-40 w-48 text-xs text-slate-700">
            <button onclick="toggleZoom()" class="w-full text-left px-3 py-2.5 hover:bg-slate-50 rounded-xl flex items-center gap-2.5 transition-colors">
                <i class="fa-solid fa-magnifying-glass text-slate-500"></i> Zoom na página
            </button>
            <button onclick="goToSlide(0)" class="w-full text-left px-3 py-2.5 hover:bg-slate-50 rounded-xl flex items-center gap-2.5 transition-colors">
                <i class="fa-solid fa-rotate-left text-slate-500"></i> Voltar ao início
            </button>
            <button onclick="closeDocumentView()" class="w-full text-left px-3 py-2.5 hover:bg-slate-50 rounded-xl flex items-center gap-2.5 text-rose-600 transition-colors border-t border-slate-100 mt-1">
                <i class="fa-solid fa-xmark"></i> Fechar documento
            </button>
        </div>

        <!-- ================= BOTTOM NAVIGATION BAR ================= -->
        <div class="bg-white border-t border-slate-200 px-3 py-2 flex justify-around items-end relative z-30 select-none">
            
            <!-- Tab 1: Início -->
            <button onclick="closeDocumentView()" class="flex flex-col items-center gap-1 text-slate-500 hover:text-govNavy w-14">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium">Início</span>
            </button>

            <!-- Tab 2: Dados -->
            <button class="flex flex-col items-center gap-1 text-slate-500 hover:text-govNavy w-14">
                <i class="fa-solid fa-clipboard-list text-lg"></i>
                <span class="text-[10px] font-medium">Dados</span>
            </button>

            <!-- Center Tab: QR Code -->
            <button class="flex flex-col items-center -top-4 relative group">
                <div class="w-13 h-13 p-3 rounded-full bg-govGreen text-white flex items-center justify-center shadow-lg group-active:scale-95 transition-transform border-4 border-white">
                    <i class="fa-solid fa-qrcode text-2xl"></i>
                </div>
                <span class="text-[10px] font-medium text-slate-600 mt-0.5">QR Code</span>
            </button>

            <!-- Tab 3: Carteira (Active) -->
            <button onclick="closeDocumentView()" class="flex flex-col items-center gap-1 text-govNavy font-semibold w-14">
                <i class="fa-solid fa-wallet text-lg"></i>
                <span class="text-[10px]">Carteira</span>
            </button>

            <!-- Tab 4: Menu -->
            <button class="flex flex-col items-center gap-1 text-slate-500 hover:text-govNavy w-14">
                <i class="fa-solid fa-bars text-lg"></i>
                <span class="text-[10px] font-medium">Menu</span>
            </button>

        </div>

    </div>

    <!-- CAROUSEL & PDF INTERACTION SCRIPT -->
    <script>
        let currentSlide = 0;
        let totalSlides = 4; // Always tied to 4 indicator dots
        let currentZoom = 1;
        let loadedPdfDoc = null;

        // Drag/Swipe variables
        let startX = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;
        let isDragging = false;

        const track = document.getElementById('carousel-track');
        const viewport = document.getElementById('carousel-viewport');

        // Initial setup on window load
        window.onload = function() {
            renderDefaultFallbackSlides();
            setupTouchAndDrag();
        };

        // Open & Close View Transitions
        function openDocumentView() {
            const docView = document.getElementById('view-documento');
            docView.classList.remove('translate-x-full');
            docView.classList.add('translate-x-0');
            resetZoom();
            goToSlide(0);
        }

        function closeDocumentView() {
            const docView = document.getElementById('view-documento');
            docView.classList.remove('translate-x-0');
            docView.classList.add('translate-x-full');
            document.getElementById('options-menu').classList.add('hidden');
        }

        // Render Fallback Realistic Canvas Cards when no PDF is provided
        function renderDefaultFallbackSlides() {
            track.innerHTML = '';
            
            // Create 4 synthetic pages for the carousel
            const pagesContent = [
                { title: "CARTEIRA DE IDENTIDADE", subtitle: "FRENTE DO DOCUMENTO", side: 1 },
                { title: "CARTEIRA DE IDENTIDADE", subtitle: "VERSO DO DOCUMENTO", side: 2 },
                { title: "QR CODE DE VALIDAÇÃO", subtitle: "AUTENTICIDADE DIGITAL", side: 3 },
                { title: "INFORMAÇÕES COMPLEMENTARES", subtitle: "OBSERVAÇÕES E DADOS", side: 4 }
            ];

            pagesContent.forEach((item, idx) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                
                slide.innerHTML = `
                    <div class="w-full max-w-[340px] rounded-xl guilloche-bg border border-teal-300 p-4 shadow-md relative overflow-hidden text-slate-800 text-xs leading-tight select-none">
                        <div class="text-center mb-3">
                            <h3 class="font-extrabold text-[11px] text-govGreen tracking-wider uppercase">República Federativa do Brasil</h3>
                            <p class="text-[9px] font-bold text-govGreen uppercase">Governo Federal</p>
                            <p class="text-[8px] text-slate-600 font-semibold uppercase">Secretaria de Estado da Segurança Pública</p>
                            <h2 class="font-black text-xs text-slate-900 mt-1 uppercase tracking-tight">${item.title}</h2>
                            <span class="inline-block bg-slate-200 text-slate-700 text-[8px] font-bold px-2 py-0.5 rounded mt-1">${item.subtitle} (Pág. ${idx + 1}/4)</span>
                        </div>

                        ${idx === 0 ? `
                        <div class="grid grid-cols-12 gap-3 items-start my-2">
                            <div class="col-span-4 flex flex-col items-center gap-1">
                                <div class="w-full aspect-[3/4] bg-slate-200 border-2 border-slate-300 rounded overflow-hidden flex flex-col items-center justify-center text-slate-400">
                                    <i class="fa-solid fa-user text-3xl"></i>
                                    <span class="text-[7px] font-bold text-slate-500 mt-1 uppercase">Foto Exemplo</span>
                                </div>
                                <span class="font-serif italic text-[8px] text-slate-600 border-t border-slate-300 w-full text-center mt-1 pt-0.5">Assinatura</span>
                            </div>
                            <div class="col-span-8 space-y-1.5">
                                <div>
                                    <span class="text-[7px] text-slate-500 uppercase block font-semibold">Nome / Name</span>
                                    <span class="font-bold text-slate-900 text-[10px] block uppercase">NOME COMPLETO DO CIDADÃO</span>
                                </div>
                                <div>
                                    <span class="text-[7px] text-slate-500 uppercase block font-semibold">CPF</span>
                                    <span class="font-bold text-slate-900 text-[10px] font-mono block">000.000.000-00</span>
                                </div>
                                <div class="grid grid-cols-2 gap-1">
                                    <div>
                                        <span class="text-[7px] text-slate-500 uppercase block font-semibold">Data Nasc.</span>
                                        <span class="font-semibold text-slate-900 text-[9px]">01/01/2000</span>
                                    </div>
                                    <div>
                                        <span class="text-[7px] text-slate-500 uppercase block font-semibold">Sexo</span>
                                        <span class="font-semibold text-slate-900 text-[9px]">F / M</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        ` : idx === 1 ? `
                        <div class="space-y-2 my-4 bg-white/70 p-3 rounded-lg border border-slate-200">
                            <div>
                                <span class="text-[8px] text-slate-500 uppercase block font-semibold">Filiação / Parents</span>
                                <p class="font-semibold text-slate-900 text-[9px]">NOME DO PAI EXEMPLO</p>
                                <p class="font-semibold text-slate-900 text-[9px]">NOME DA MÃE EXEMPLO</p>
                            </div>
                            <div>
                                <span class="text-[8px] text-slate-500 uppercase block font-semibold">Órgão Emissor / Issuer</span>
                                <p class="font-semibold text-slate-900 text-[9px]">SSP - ESTADO EXEMPLO</p>
                            </div>
                        </div>
                        ` : idx === 2 ? `
                        <div class="flex flex-col items-center justify-center my-4 p-2 bg-white rounded-lg border border-slate-200 text-center">
                            <div class="w-28 h-28 bg-slate-900 text-white flex items-center justify-center rounded-md p-2">
                                <i class="fa-solid fa-qrcode text-6xl"></i>
                            </div>
                            <span class="text-[8px] text-slate-500 font-mono mt-2">CÓDIGO DE AUTENTICAÇÃO FICTÍCIO</span>
                        </div>
                        ` : `
                        <div class="my-4 p-3 bg-white/80 rounded-lg border border-slate-200 space-y-2">
                            <span class="text-[8px] text-slate-500 uppercase block font-semibold">Observações / Notes</span>
                            <p class="text-[9px] text-slate-700 italic leading-relaxed">Documento gerado para simulação educacional de interface web mobile gov.br.</p>
                        </div>
                        `}

                        <div class="mt-2 pt-2 border-t border-teal-200 flex justify-between items-center text-[7px] text-slate-500">
                            <span>MODELO ACADÊMICO FICTÍCIO</span>
                            <i class="fa-solid fa-shield-halved text-teal-700 text-xs"></i>
                        </div>
                    </div>
                `;
                track.appendChild(slide);
            });

            updateCarouselPosition();
        }

        // Upload custom PDF and map pages to Carousel Track
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file || file.type !== 'application/pdf') return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const typedarray = new Uint8Array(e.target.result);
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    loadedPdfDoc = pdf;
                    renderPdfToSlides(pdf);
                    document.getElementById('upload-status').classList.remove('hidden');
                });
            };
            reader.readAsArrayBuffer(file);
        }

        async function renderPdfToSlides(pdf) {
            track.innerHTML = '';
            const totalPdfPages = pdf.numPages;

            // We render pages (up to 4) directly into track slides
            for (let i = 1; i <= Math.min(totalPdfPages, 4); i++) {
                const page = await pdf.getPage(i);
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';

                const canvas = document.createElement('canvas');
                canvas.className = 'rounded-xl shadow-md border border-slate-200 max-w-full max-h-[480px] object-contain bg-white';
                
                const viewport = page.getViewport({ scale: 1.2 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: canvas.getContext('2d'),
                    viewport: viewport
                };

                await page.render(renderContext).promise;
                slide.appendChild(canvas);
                track.appendChild(slide);
            }

            // Fill remaining slides if PDF has fewer than 4 pages
            for (let i = totalPdfPages + 1; i <= 4; i++) {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `
                    <div class="w-full max-w-[320px] h-[380px] bg-white rounded-xl border border-dashed border-slate-300 flex flex-col items-center justify-center p-6 text-slate-400 text-center">
                        <i class="fa-solid fa-file-circle-minus text-4xl mb-2"></i>
                        <span class="text-xs font-semibold">Página ${i} não disponível</span>
                        <p class="text-[10px] text-slate-400 mt-1">O arquivo enviado possui apenas ${totalPdfPages} página(s).</p>
                    </div>
                `;
                track.appendChild(slide);
            }

            goToSlide(0);
        }

        // Navigation Functions
        function goToSlide(index) {
            if (index < 0) index = 0;
            if (index >= totalSlides) index = totalSlides - 1;
            currentSlide = index;
            updateCarouselPosition();
            updateDots();
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                goToSlide(currentSlide + 1);
            } else {
                goToSlide(0); // Loop back
            }
        }

        function updateCarouselPosition() {
            currentTranslate = -currentSlide * viewport.offsetWidth;
            prevTranslate = currentTranslate;
            track.style.transform = `translateX(${currentTranslate}px)`;
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot-item');
            dots.forEach((dot, idx) => {
                if (idx === currentSlide) {
                    dot.classList.remove('bg-slate-300');
                    dot.classList.add('bg-govNavy', 'scale-110');
                } else {
                    dot.classList.remove('bg-govNavy', 'scale-110');
                    dot.classList.add('bg-slate-300');
                }
            });
        }

        // Zoom Control
        function toggleZoom() {
            const zoomWrapper = document.getElementById('zoom-wrapper');
            const zoomIcon = document.getElementById('zoom-icon');
            if (currentZoom === 1) {
                currentZoom = 1.4;
                zoomIcon.classList.remove('fa-magnifying-glass-plus');
                zoomIcon.classList.add('fa-magnifying-glass-minus');
            } else {
                currentZoom = 1;
                zoomIcon.classList.remove('fa-magnifying-glass-minus');
                zoomIcon.classList.add('fa-magnifying-glass-plus');
            }
            zoomWrapper.style.transform = `scale(${currentZoom})`;
        }

        function resetZoom() {
            currentZoom = 1;
            const zoomWrapper = document.getElementById('zoom-wrapper');
            const zoomIcon = document.getElementById('zoom-icon');
            zoomWrapper.style.transform = 'scale(1)';
            if (zoomIcon) {
                zoomIcon.classList.remove('fa-magnifying-glass-minus');
                zoomIcon.classList.add('fa-magnifying-glass-plus');
            }
        }

        function toggleOptionsMenu() {
            const menu = document.getElementById('options-menu');
            menu.classList.toggle('hidden');
        }

        // Touch & Mouse Dragging handlers for smooth sliding
        function setupTouchAndDrag() {
            viewport.addEventListener('touchstart', touchStart);
            viewport.addEventListener('touchend', touchEnd);
            viewport.addEventListener('touchmove', touchMove);

            viewport.addEventListener('mousedown', touchStart);
            viewport.addEventListener('mouseup', touchEnd);
            viewport.addEventListener('mouseleave', touchEnd);
            viewport.addEventListener('mousemove', touchMove);
        }

        function touchStart(event) {
            if (currentZoom > 1) return; // Disable swipe drag during zoom
            isDragging = true;
            startX = getPositionX(event);
            track.style.transition = 'none';
        }

        function touchMove(event) {
            if (!isDragging) return;
            const currentX = getPositionX(event);
            const diffX = currentX - startX;
            currentTranslate = prevTranslate + diffX;
            track.style.transform = `translateX(${currentTranslate}px)`;
        }

        function touchEnd() {
            if (!isDragging) return;
            isDragging = false;
            track.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)';
            const movedBy = currentTranslate - prevTranslate;

            if (movedBy < -50 && currentSlide < totalSlides - 1) {
                currentSlide += 1;
            } else if (movedBy > 50 && currentSlide > 0) {
                currentSlide -= 1;
            }

            goToSlide(currentSlide);
        }

        function getPositionX(event) {
            return event.type.includes('touch') ? event.touches[0].clientX : event.clientX;
        }

        // Recalculate layout on window resize
        window.addEventListener('resize', () => {
            updateCarouselPosition();
        });
    </script>
</body>
</html>
